services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: fireaware-postgres
    environment:
      POSTGRES_USER: fireaware
      POSTGRES_PASSWORD: fireaware
      POSTGRES_DB: fireaware
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fireaware -d fireaware"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: fireaware-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: fireaware
      MINIO_ROOT_PASSWORD: fireaware-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 fireaware fireaware-secret;
      mc mb --ignore-existing local/fireaware-photos;
      mc anonymous set download local/fireaware-photos;
      exit 0;
      "

volumes:
  postgres-data:
  minio-data:
